[package]
name = "pqc_timing_harness"
version = "0.1.0"
edition = "2021"

[dependencies]
mlua = { version = "0.9", features = ["lua54", "vendored"] }
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"
oqs = { version = "0.10", default-features = false, features = ["sigs"] }
ratatui = "0.29"
crossterm = "0.28"
rand = "0.8" # Used to simulate live fluctuating timing pulses for the demo